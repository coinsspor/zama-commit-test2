name: sei-killswitch-solo-control

on:
  push:
    branches:
      - tmp-sei-killswitch-solo-ci-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solo-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASELINE: f70ea4fea2dbb6145bec697e86140940ff310030
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config time \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            zlib1g-dev libbz2-dev libgflags-dev libjemalloc-dev
      - name: Fetch exact Sei baseline/current main
        run: |
          set -euxo pipefail
          mkdir sei-chain
          cd sei-chain
          git init
          git remote add origin https://github.com/sei-protocol/sei-chain.git
          git fetch --depth=1 origin "$BASELINE"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASELINE"
      - name: Run official solo nested-origin control
        run: |
          set -o pipefail
          mkdir -p evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL
          cd sei-chain
          /usr/bin/time -v go test ./precompiles/solo \
            -run '^TestExecute$' \
            -count=1 -v -timeout=45m \
            2>&1 | tee ../evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL/solo-testexecute.log
      - name: Preserve metadata
        if: always()
        run: |
          mkdir -p evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL
          {
            echo "baseline=$BASELINE"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            git -C sei-chain rev-parse HEAD || true
          } > evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL/ci-meta.txt
          uname -a > evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL/uname.txt || true
          lscpu > evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL/lscpu.txt || true
          go version > evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL/go-version.txt || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL-evidence
          path: evidence/CAND-SEI-WASM-KILLSWITCH-SOLO-CONTROL
          if-no-files-found: error
          retention-days: 7
