name: sei-dynamic-gas-nonkv-local-ci

on:
  push:
    branches:
      - tmp-sei-dynamic-gas-ci-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-gas-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASELINE: f70ea4fea2dbb6145bec697e86140940ff310030
      GOTOOLCHAIN: auto
      CAND_SEI_VARIANTS: '620'
    steps:
      - name: Checkout CI payload
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config time \
            librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            zlib1g-dev libbz2-dev libgflags-dev libjemalloc-dev

      - name: Fetch exact Sei baseline/current main
        run: |
          set -euxo pipefail
          mkdir sei-chain
          cd sei-chain
          git init
          git remote add origin https://github.com/sei-protocol/sei-chain.git
          git fetch --depth=1 origin "$BASELINE"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASELINE"
          go version

      - name: Materialize local-only benchmark
        run: |
          set -euxo pipefail
          mkdir -p evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001 tmp-root
          cp tmp/sei-dynamic/cand_sei_dynamic_gas_nonkv_test_v2.go sei-chain/precompiles/wasmd/cand_sei_dynamic_gas_nonkv_test.go
          cp tmp/sei-dynamic/cand_sei_dynamic_metrics.go sei-chain/sei-wasmd/x/wasm/keeper/
          gofmt -w \
            sei-chain/precompiles/wasmd/cand_sei_dynamic_gas_nonkv_test.go \
            sei-chain/sei-wasmd/x/wasm/keeper/cand_sei_dynamic_metrics.go
          git -C sei-chain diff --check
          git -C sei-chain diff -- \
            precompiles/wasmd/cand_sei_dynamic_gas_nonkv_test.go \
            sei-wasmd/x/wasm/keeper/cand_sei_dynamic_metrics.go \
            > evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/applied.diff

      - name: Compile and run production-path probe
        env:
          TMPDIR: ${{ github.workspace }}/tmp-root
          CAND_SEI_TMP_ROOT: ${{ github.workspace }}/tmp-root
          CAND_SEI_EVIDENCE_DIR: ${{ github.workspace }}/evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001
        run: |
          set -o pipefail
          cd sei-chain
          /usr/bin/time -v go test ./precompiles/wasmd \
            -run '^TestCANDSEIDynamicGasNonKV001$' \
            -count=1 -v -timeout=100m \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/go-test.log"

      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001
          {
            echo "baseline=$BASELINE"
            echo "variants=$CAND_SEI_VARIANTS"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            git -C sei-chain rev-parse HEAD || true
            git -C sei-chain status --short || true
          } > evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/ci-meta.txt
          uname -a > evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/uname.txt || true
          lscpu > evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/lscpu.txt || true
          free -h > evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/memory.txt || true
          df -h > evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/disk.txt || true
          go version > evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/go-version.txt || true
          cp sei-chain/precompiles/wasmd/cand_sei_dynamic_gas_nonkv_test.go evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/ || true
          cp sei-chain/sei-wasmd/x/wasm/keeper/cand_sei_dynamic_metrics.go evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001/ || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAND-SEI-DYNAMIC-GAS-NONKV-001-evidence-v2
          path: evidence/CAND-SEI-DYNAMIC-GAS-NONKV-001
          if-no-files-found: error
          retention-days: 7
